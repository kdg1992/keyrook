version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Only minor and patch updates are grouped, so every major update gets its own pull request.
    # Security libraries (Bouncy Castle, Apache MINA SSHD) always stay outside the group.
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.bouncycastle*"
          - "org.apache.sshd*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
