name: Dependency graph PR

on:
  # Not a required check, so a path filter may skip it. Markdown-only changes other than
  # CHANGELOG.md need no graph; Dependency review skips them itself and fails closed otherwise.
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '**CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: dependency-graph-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(runtimeClasspath|.*RuntimeClasspath)$'
          DEPENDENCY_GRAPH_RUNTIME_EXCLUDE_CONFIGURATIONS: '.*[Tt]est.*'
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
          dependency-graph: generate-and-upload
          artifact-retention-days: 7
