name: Dependency review

on:
  pull_request:
  # Reviews pull requests whose events cannot start workflows, such as Release Please updates.
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base commit SHA; defaults to the merge base with main
        required: false
        type: string
      head-ref:
        description: Head commit SHA; must equal the dispatched branch head, which receives the check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve compared commits
        shell: bash
        env:
          BASE_INPUT: ${{ github.event.pull_request.base.sha || inputs.base-ref }}
          HEAD_INPUT: ${{ github.event.pull_request.head.sha || inputs.head-ref || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_INPUT"
          if [ -z "$base" ]; then base="$(git merge-base origin/main "$GITHUB_SHA")"; fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$HEAD_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Base and head must be full commit SHAs'; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$HEAD_INPUT" != "$GITHUB_SHA" ]; then
            echo 'The reviewed head must be the commit this check is reported on'; exit 1
          fi
          echo "Comparing $base...$HEAD_INPUT"
          { echo "BASE_SHA=$base"; echo "HEAD_SHA=$HEAD_INPUT"; } >> "$GITHUB_ENV"
      # Only pull requests may skip the review; dispatched reviews always run in full.
      - name: Classify changed paths
        id: paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: node scripts/classify-changes.mjs
      - name: Complete documentation-only check
        if: steps.paths.outputs.docs-only == 'true'
        shell: bash
        run: echo 'Documentation-only change; dependency manifests are unchanged.'
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        id: review
        if: steps.paths.outputs.docs-only != 'true'
        with:
          base-ref: ${{ env.BASE_SHA }}
          head-ref: ${{ env.HEAD_SHA }}
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          warn-only: false
          fail-on-scopes: runtime, development, unknown
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, 0BSD, GPL-3.0-only, GPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later
          # EPL-2.0 JUnit is test tooling only; checkRuntimeDependencies enforces this boundary.
          # Other exact-version metadata corrections are evidenced in licenses/Dependency-Metadata.md.
          allow-dependencies-licenses: >-
            pkg:maven/org.junit/junit-bom@6.1.3,
            pkg:maven/org.junit.jupiter/junit-jupiter@6.1.3,
            pkg:maven/org.junit.jupiter/junit-jupiter-api@6.1.3,
            pkg:maven/org.junit.jupiter/junit-jupiter-engine@6.1.3,
            pkg:maven/org.junit.jupiter/junit-jupiter-params@6.1.3,
            pkg:maven/org.junit.platform/junit-platform-commons@6.1.3,
            pkg:maven/org.junit.platform/junit-platform-engine@6.1.3,
            pkg:maven/org.junit.platform/junit-platform-launcher@6.1.3,
            pkg:maven/org.bouncycastle/bcpkix-jdk18on@1.86,
            pkg:maven/org.bouncycastle/bcutil-jdk18on@1.86,
            pkg:maven/androidx.compose.runtime/runtime-retain@1.12.1,
            pkg:maven/androidx.compose.runtime/runtime-retain-desktop@1.12.1,
            pkg:maven/androidx.lifecycle/lifecycle-runtime-compose-desktop@2.11.0,
            pkg:maven/androidx.lifecycle/lifecycle-runtime-compose-desktop@2.9.4,
            pkg:maven/androidx.lifecycle/lifecycle-runtime-desktop@2.11.0,
            pkg:maven/androidx.lifecycle/lifecycle-runtime-desktop@2.9.4,
            pkg:maven/androidx.lifecycle/lifecycle-viewmodel-compose-desktop@2.11.0,
            pkg:maven/androidx.lifecycle/lifecycle-viewmodel-desktop@2.11.0,
            pkg:maven/androidx.lifecycle/lifecycle-viewmodel-savedstate-desktop@2.11.0,
            pkg:maven/androidx.navigationevent/navigationevent@1.1.1,
            pkg:maven/androidx.navigationevent/navigationevent-compose@1.1.1,
            pkg:maven/androidx.navigationevent/navigationevent-compose-desktop@1.1.1,
            pkg:maven/androidx.navigationevent/navigationevent-desktop@1.1.1,
            pkg:maven/androidx.savedstate/savedstate-compose-desktop@1.4.0,
            pkg:maven/androidx.savedstate/savedstate-desktop@1.4.0,
            pkg:maven/org.jetbrains.androidx.lifecycle/lifecycle-runtime-compose-desktop@2.9.6,
            pkg:maven/org.jetbrains.androidx.navigationevent/navigationevent-compose@1.1.0,
            pkg:maven/org.jetbrains.androidx.navigationevent/navigationevent-compose-desktop@1.1.0,
            pkg:maven/org.jetbrains.kotlinx/kotlinx-coroutines-bom@1.9.0,
            pkg:maven/org.jetbrains.kotlinx/kotlinx-coroutines-bom@1.11.0,
            pkg:maven/org.gradle/github-dependency-graph-gradle-plugin@1.4.2,
            pkg:githubactions/gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb,
            pkg:githubactions/gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900
          comment-summary-in-pr: never
      - name: Reject missing licenses and incomplete snapshots
        if: steps.paths.outputs.docs-only != 'true'
        shell: bash
        env:
          INVALID_LICENSES: ${{ steps.review.outputs.invalid-license-changes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          async function verify() {
            const invalid = JSON.parse(process.env.INVALID_LICENSES);
            for (const category of ['unlicensed', 'unresolved', 'forbidden']) {
              if (!Array.isArray(invalid[category])) {
                throw new Error(`Invalid license review output: missing ${category} list.`);
              }
              if (invalid[category].length !== 0) {
                const packages = invalid[category].map(change => ({
                  package: change.package_url, manifest: change.manifest, license: change.license
                }));
                throw new Error(`Dependencies need reviewed, compatible licenses (${category}): ${JSON.stringify(packages)}`);
              }
            }
            const {GITHUB_API_URL, GITHUB_REPOSITORY, BASE_SHA, HEAD_SHA, GH_TOKEN} = process.env;
            const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}?per_page=1`;
            const response = await fetch(url, {
              headers: {authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28'},
              signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error(`Dependency snapshot verification failed (${response.status}).`);
            const warning = response.headers.get('x-github-dependency-graph-snapshot-warnings');
            if (warning && Buffer.from(warning, 'base64').toString('utf8').trim()) {
              throw new Error('Dependency snapshots are incomplete; submit both graphs and rerun this check.');
            }
          }
          verify().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
