name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  packages:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false
      - name: Download verified packaging JDK
        id: packaging-jdk
        run: node scripts/collect-jdk-archive.mjs runtime
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          # Cache label only; the exact Temurin 25.0.4.1+1 archive is hash-pinned above.
          java-version: '25.0.4'
          jdkFile: ${{ steps.packaging-jdk.outputs.archive-path }}
          force-download: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
      - name: Collect unreviewed native redistribution evidence
        id: inventory
        shell: bash
        run: bash ./gradlew :app:collectNativeDistributionInventory --no-daemon --console=plain
      - name: Retain evidence for license review
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-inventory-${{ matrix.platform }}
          path: app/build/reports/native-inventory/
          if-no-files-found: error
          retention-days: 7
      - name: Verify native redistribution inventory
        shell: bash
        run: bash ./gradlew :app:checkNativeDistributionLicenses --no-daemon --console=plain
      - name: Install Linux packaging prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm
      - name: Test and build unsigned native installers
        shell: bash
        run: bash ./gradlew check :app:packageDistributionForCurrentOS --no-daemon --console=plain
      - name: Verify packaged runtime and desktop rendering
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const relative = {
            win32: 'Keyrook/Keyrook.exe',
            darwin: 'Keyrook.app/Contents/MacOS/Keyrook',
            linux: 'Keyrook/bin/Keyrook'
          }[process.platform];
          if (!relative) throw Error('Unsupported runtime-check platform');
          const launcher = path.resolve('app/build/compose/binaries/main/app', relative);
          if (!fs.lstatSync(launcher).isFile()) throw Error('Packaged launcher missing');
          const report = path.resolve('build/packaged-runtime-check.txt');
          if (fs.existsSync(report)) throw Error('Runtime-check report already exists');
          const result = spawnSync(launcher, ['--self-test', report], {
            timeout: 120000, windowsHide: true, stdio: 'pipe', maxBuffer: 1024 * 1024
          });
          if (result.error || result.status !== 0 || !fs.existsSync(report) ||
              fs.readFileSync(report, 'utf8') !== 'Keyrook runtime check passed\n') {
            throw Error('Packaged runtime check failed');
          }
          console.log('Packaged cryptography, SSH and desktop rendering verified');
          NODE
      - name: Collect installers and bundled notices
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const platform = process.env.PACKAGE_PLATFORM;
          const architecture = process.arch === 'arm64' ? 'arm64' : 'x64';
          if (!['x64', 'arm64'].includes(process.arch)) throw Error('Unsupported runner architecture');
          const version = fs.readFileSync('version.txt', 'utf8').trim();
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid release version');
          const extensions = {linux: ['deb', 'rpm'], windows: ['msi'], macos: ['dmg']}[platform];
          if (!extensions) throw Error('Invalid package platform');
          const root = 'app/build/compose/binaries/main';
          const files = fs.readdirSync(root, {recursive: true}).map(file => path.join(root, file));
          fs.mkdirSync('build/release', {recursive: true});
          for (const extension of extensions) {
            const matches = files.filter(file => file.endsWith(`.${extension}`) && fs.statSync(file).isFile());
            if (matches.length !== 1) throw Error(`Expected one ${extension} installer`);
            fs.copyFileSync(matches[0], `build/release/Keyrook-${version}-${platform}-${architecture}.${extension}`);
          }
          for (const name of ['LICENSE', 'THIRD-PARTY-NOTICES']) fs.copyFileSync(name, `build/release/${name}`);
          fs.writeFileSync('build/package-target.txt', `${platform}-${architecture}`);
          NODE
          target="$(cat build/package-target.txt)"
          tar -czf "build/release/Keyrook-notices-${target}.tar.gz" -C app/build/packagingResources/common .
          node <<'NODE'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const target = fs.readFileSync('build/package-target.txt', 'utf8');
          const files = fs.readdirSync('build/release').sort();
          fs.writeFileSync(`build/release/SHA256SUMS-${target}.txt`, files.map(file =>
            `${createHash('sha256').update(fs.readFileSync(`build/release/${file}`)).digest('hex')}  ${file}\n`).join(''));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

  publish:
    needs: [release-please, packages]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Collect matching JDK source archive
        run: node scripts/collect-jdk-archive.mjs
      - name: Download and verify all platform outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for platform in linux windows macos; do
            gh run download "$RUN_ID" --name "packages-${platform}" --dir "build/packages/${platform}"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {createHash} = require('node:crypto');
          const digest = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.mkdirSync('build/release', {recursive: true});
          for (const platform of ['linux', 'windows', 'macos']) {
            const directory = `build/packages/${platform}`;
            const names = fs.readdirSync(directory);
            const manifests = names.filter(name => /^SHA256SUMS-[a-z]+-(x64|arm64)\.txt$/.test(name));
            if (manifests.length !== 1) throw Error('Missing checksum manifest');
            const lines = fs.readFileSync(path.join(directory, manifests[0]), 'utf8').trim().split('\n');
            const verified = new Set();
            for (const line of lines) {
              const match = /^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$/.exec(line);
              if (!match || match[2] === '.' || match[2] === '..' || verified.has(match[2])) throw Error('Invalid checksum record');
              const expected = match[1], name = match[2];
              const source = path.join(directory, name);
              if (!fs.lstatSync(source).isFile() || digest(source) !== expected) throw Error('Package checksum mismatch');
              const target = `build/release/${name}`;
              if (fs.existsSync(target) && digest(target) !== expected) throw Error('Conflicting package output');
              fs.copyFileSync(source, target);
              verified.add(name);
            }
            if (names.some(name => name !== manifests[0] && !verified.has(name))) throw Error('Unverified package output');
          }
          const names = fs.readdirSync('build/release').sort();
          if (!['msi','dmg','deb','rpm'].every(extension => names.filter(name => name.endsWith(`.${extension}`)).length === 1)) {
            throw Error('Incomplete installer set');
          }
          for (const name of fs.readdirSync('build/jdk-source')) {
            if (name.endsWith('.partial') || fs.existsSync(`build/release/${name}`)) throw Error('Invalid source output');
            fs.copyFileSync(`build/jdk-source/${name}`, `build/release/${name}`);
          }
          const releaseFiles = fs.readdirSync('build/release').sort();
          fs.writeFileSync('build/release/SHA256SUMS.txt', releaseFiles.map(name => `${digest(`build/release/${name}`)}  ${name}\n`).join(''));
          NODE
      - name: Upload installers and unsigned installation instructions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > build/release-notes.md
          node <<'NODE'
          const fs = require('node:fs');
          const notes = fs.readFileSync('build/release-notes.md', 'utf8');
          const instructions = fs.readFileSync('docs/PACKAGING.md', 'utf8').split('<!-- unsigned-start -->')[1]?.split('<!-- unsigned-end -->')[0];
          if (!instructions) throw Error('Unsigned installation instructions are missing');
          if (!notes.includes('## Unsigned installers')) fs.appendFileSync('build/release-notes.md', '\n' + instructions);
          NODE
          gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
