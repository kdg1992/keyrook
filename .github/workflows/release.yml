name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release Please creates and updates its PR with GITHUB_TOKEN, which starts no pull_request workflows.
  release-pr-checks:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/release-pr-checks.yml
    with:
      title: ${{ fromJSON(needs.release-please.outputs.pr).title }}
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  packages:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit images keep installers reproducible; each must stay on the architecture
          # of its reviewed licenses/native/<os>-<arch> inventory (x64, x64, arm64).
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false
      - name: Download verified packaging JDK
        id: packaging-jdk
        run: node scripts/collect-jdk-archive.mjs runtime
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          # Cache label only; the exact Temurin 25.0.4.1+1 archive is hash-pinned above.
          java-version: '25.0.4'
          jdkFile: ${{ steps.packaging-jdk.outputs.archive-path }}
          force-download: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
      - name: Collect unreviewed native redistribution evidence
        id: inventory
        shell: bash
        run: bash ./gradlew :app:collectNativeDistributionInventory --no-daemon --console=plain
      - name: Retain evidence for license review
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-inventory-${{ matrix.platform }}
          path: app/build/reports/native-inventory/
          if-no-files-found: error
          retention-days: 7
      - name: Install Linux packaging prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm
      - name: Verify inventory, test and build unsigned native installers
        shell: bash
        # The inventory check runs first so an unreviewed runtime fails before tests and packaging.
        # Native installer tasks do not build the app image checked below; request it explicitly.
        run: >-
          bash ./gradlew :app:checkNativeDistributionLicenses check :app:createDistributable
          :app:packageDistributionForCurrentOS --no-daemon --console=plain
      - name: Show packaging tool output
        if: failure()
        shell: bash
        run: |
          if [ -d app/build/compose/logs ]; then
            find app/build/compose/logs -type f -name '*.txt' -print -exec cat {} \;
          fi
      - name: Verify packaged runtime and desktop rendering
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const relative = {
            win32: 'Keyrook/Keyrook.exe',
            darwin: 'Keyrook.app/Contents/MacOS/Keyrook',
            linux: 'Keyrook/bin/Keyrook'
          }[process.platform];
          if (!relative) throw Error('Unsupported runtime-check platform');
          const launcher = path.resolve('app/build/compose/binaries/main/app', relative);
          if (!fs.lstatSync(launcher).isFile()) throw Error('Packaged launcher missing');
          const report = path.resolve('build/packaged-runtime-check.txt');
          if (fs.existsSync(report)) throw Error('Runtime-check report already exists');
          const result = spawnSync(launcher, ['--self-test', report], {
            timeout: 120000, windowsHide: true, stdio: 'pipe', maxBuffer: 1024 * 1024
          });
          if (result.error || result.status !== 0 || !fs.existsSync(report) ||
              fs.readFileSync(report, 'utf8') !== 'Keyrook runtime check passed\n') {
            throw Error('Packaged runtime check failed');
          }
          console.log('Packaged cryptography, SSH and desktop rendering verified');
          NODE
      - name: Collect installers and bundled notices
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const platform = process.env.PACKAGE_PLATFORM;
          const architecture = process.arch === 'arm64' ? 'arm64' : 'x64';
          if (!['x64', 'arm64'].includes(process.arch)) throw Error('Unsupported runner architecture');
          const version = fs.readFileSync('version.txt', 'utf8').trim();
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid release version');
          const extensions = {linux: ['deb', 'rpm'], windows: ['msi'], macos: ['dmg']}[platform];
          if (!extensions) throw Error('Invalid package platform');
          const root = 'app/build/compose/binaries/main';
          const files = fs.readdirSync(root, {recursive: true}).map(file => path.join(root, file));
          fs.mkdirSync('build/release', {recursive: true});
          for (const extension of extensions) {
            const matches = files.filter(file => file.endsWith(`.${extension}`) && fs.statSync(file).isFile());
            if (matches.length !== 1) throw Error(`Expected one ${extension} installer`);
            fs.copyFileSync(matches[0], `build/release/Keyrook-${version}-${platform}-${architecture}.${extension}`);
          }
          for (const name of ['LICENSE', 'THIRD-PARTY-NOTICES']) fs.copyFileSync(name, `build/release/${name}`);
          fs.writeFileSync('build/package-target.txt', `${platform}-${architecture}`);
          NODE
          target="$(cat build/package-target.txt)"
          tar -czf "build/release/Keyrook-notices-${target}.tar.gz" -C app/build/packagingResources/common .
          node <<'NODE'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const target = fs.readFileSync('build/package-target.txt', 'utf8');
          const files = fs.readdirSync('build/release').sort();
          fs.writeFileSync(`build/release/SHA256SUMS-${target}.txt`, files.map(file =>
            `${createHash('sha256').update(fs.readFileSync(`build/release/${file}`)).digest('hex')}  ${file}\n`).join(''));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

  installer-tests:
    needs: [release-please, packages]
    if: always() && !cancelled() && needs.packages.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit images keep installers reproducible; each must stay on the architecture
          # of its reviewed licenses/native/<os>-<arch> inventory (x64, x64, arm64).
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false
      - name: Download this run's installers
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name "packages-${PACKAGE_PLATFORM}" --dir build/packages
          mkdir -p "$RUNNER_TEMP/installer-logs"

      # Linux DEB directly on the Ubuntu runner.
      - name: Select DEB installers
        id: deb
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/installer-test.mjs prepare deb
      - name: Test DEB install, upgrade and removal
        if: runner.os == 'Linux'
        shell: bash
        env:
          NEW_INSTALLER: ${{ steps.deb.outputs.new-installer }}
          NEW_VERSION: ${{ steps.deb.outputs.new-version }}
          OLD_INSTALLER: ${{ steps.deb.outputs.old-installer }}
          OLD_VERSION: ${{ steps.deb.outputs.old-version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          install_deb() { sudo apt-get install --no-install-recommends -y "./$1"; }
          launcher() {
            local found
            found="$(dpkg -L keyrook | grep -E '/bin/Keyrook$')"
            [ "$(printf '%s\n' "$found" | wc -l)" -eq 1 ] || { echo "Expected one installed launcher"; exit 1; }
            printf '%s\n' "$found"
          }
          expect_version() {
            local installed
            installed="$(dpkg-query -W -f='${Status} ${Version}\n' keyrook)"
            echo "Installed: $installed"
            [ "$(printf '%s\n' "$installed" | wc -l)" -eq 1 ] || { echo "Expected one keyrook package"; exit 1; }
            [[ "$installed" =~ ^install\ ok\ installed\ ${1//./\\.}(-[0-9A-Za-z.+~]+)?$ ]] || { echo "Expected version $1"; exit 1; }
          }
          remove_and_verify() {
            local root
            root="$(dirname "$(dirname "$(launcher)")")"
            sudo apt-get remove -y keyrook
            if dpkg-query -W -f='${Status}\n' keyrook 2>/dev/null | grep -q '^install ok installed$'; then
              echo "keyrook is still installed"; exit 1
            fi
            [ ! -e "$root" ] || { echo "Install directory remains: $root"; ls -laR "$root"; exit 1; }
            echo "Removed $root"
          }

          # As root, xdg-desktop-menu copies the entry into the first existing applications directory of
          # XDG_DATA_DIRS; maintainer scripts run under sudo's reset environment, so its default order applies.
          menu_entry=
          for directory in /usr/local/share/applications /usr/share/applications; do
            if [ -d "$directory" ]; then menu_entry="$directory/keyrook-Keyrook.desktop"; break; fi
          done
          [ -n "$menu_entry" ] || { echo "No system applications directory on the runner"; exit 1; }
          echo "Expected menu entry location: $menu_entry"

          # The runner has no XDG desktop-directories directory, like servers, containers and WSL, where
          # xdg-desktop-menu cannot register menu entries. Installation and removal must still succeed.
          echo "::group::Fresh install of $NEW_INSTALLER without a desktop menu"
          if [ -e /usr/share/desktop-directories ] || [ -e /usr/local/share/desktop-directories ]; then
            echo "::warning::Runner has a desktop-directories directory; install without a menu is not exercised"
          fi
          install_deb "$NEW_INSTALLER"
          expect_version "$NEW_VERSION"
          echo "Launcher: $(launcher)"
          node scripts/installer-test.mjs self-test "$(launcher)"
          remove_and_verify
          echo "::endgroup::"

          # A desktop system provides the directory; the menu entry must then be registered and removed.
          sudo mkdir -p /usr/share/desktop-directories
          echo "::group::Fresh install of $NEW_INSTALLER with a desktop menu"
          install_deb "$NEW_INSTALLER"
          expect_version "$NEW_VERSION"
          [ -f "$menu_entry" ] || { echo "Menu entry was not registered"; ls -l /usr/local/share/applications /usr/share/applications | grep -i keyrook || true; exit 1; }
          node scripts/installer-test.mjs self-test "$(launcher)"
          remove_and_verify
          [ ! -e "$menu_entry" ] || { echo "Menu entry remains"; exit 1; }
          echo "::endgroup::"

          # Runs with the desktop menu directory: packages up to 0.5.0 fail to configure without it.
          if [ -n "$OLD_INSTALLER" ]; then
            echo "::group::Upgrade from $OLD_VERSION to $NEW_VERSION"
            install_deb "$OLD_INSTALLER"
            expect_version "$OLD_VERSION"
            install_deb "$NEW_INSTALLER"
            expect_version "$NEW_VERSION"
            [ -f "$menu_entry" ] || { echo "Menu entry missing after upgrade"; ls -l /usr/local/share/applications /usr/share/applications | grep -i keyrook || true; exit 1; }
            node scripts/installer-test.mjs self-test "$(launcher)"
            remove_and_verify
            [ ! -e "$menu_entry" ] || { echo "Menu entry remains"; exit 1; }
            echo "::endgroup::"
          fi

      # Linux RPM in a fresh Fedora container per scenario. The package is built on Ubuntu, so the
      # desktop libraries a Fedora workstation provides are installed explicitly before it.
      - name: Select RPM installers
        id: rpm
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/installer-test.mjs prepare rpm
      - name: Test RPM install, upgrade and removal
        if: runner.os == 'Linux'
        shell: bash
        env:
          FEDORA_IMAGE: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          NEW_INSTALLER: ${{ steps.rpm.outputs.new-installer }}
          NEW_VERSION: ${{ steps.rpm.outputs.new-version }}
          OLD_INSTALLER: ${{ steps.rpm.outputs.old-installer }}
          OLD_VERSION: ${{ steps.rpm.outputs.old-version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rpm-test.sh" <<'SCRIPT'
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            mesa-libGL libX11 libXext libXrender libXi libXtst freetype fontconfig dejavu-sans-fonts
          launcher() {
            local found
            found="$(rpm -ql keyrook | grep -E '/bin/Keyrook$')"
            [ "$(printf '%s\n' "$found" | wc -l)" -eq 1 ] || { echo "Expected one installed launcher"; exit 1; }
            printf '%s\n' "$found"
          }
          expect_version() {
            local installed
            installed="$(rpm -q --qf '%{VERSION}\n' keyrook)"
            echo "Installed: $installed"
            [ "$installed" = "$1" ] || { echo "Expected exactly one keyrook package at version $1"; exit 1; }
          }
          self_test() {
            local directory report
            directory="$(mktemp -d)"
            report="$directory/report.txt"
            timeout 120 "$(launcher)" --self-test "$report"
            [ "$(cat "$report"; printf x)" = "$(printf 'Keyrook runtime check passed\nx')" ] || { echo "Runtime check report mismatch"; exit 1; }
            rm -rf "$directory"
            echo "Installed runtime check passed: $(launcher)"
          }
          remove_and_verify() {
            local root
            root="$(dirname "$(dirname "$(launcher)")")"
            dnf remove -y keyrook
            if rpm -q keyrook; then echo "keyrook is still installed"; exit 1; fi
            [ ! -e "$root" ] || { echo "Install directory remains: $root"; ls -laR "$root"; exit 1; }
            echo "Removed $root"
          }
          if [ "$MODE" = fresh ]; then
            echo "Declared requirements:"
            rpm -qpR "/work/$NEW_INSTALLER"
            ls -ld /usr/share/desktop-directories || echo "No desktop-directories directory in the image"
            dnf install -y "/work/$NEW_INSTALLER"
            expect_version "$NEW_VERSION"
            ls -l /usr/share/applications/keyrook-Keyrook.desktop || echo "No menu entry registered"
          else
            dnf install -y "/work/$OLD_INSTALLER"
            expect_version "$OLD_VERSION"
            dnf install -y "/work/$NEW_INSTALLER"
            expect_version "$NEW_VERSION"
          fi
          self_test
          remove_and_verify
          SCRIPT
          run_container() {
            docker run --rm \
              --volume "$PWD:/work:ro" --volume "$RUNNER_TEMP/rpm-test.sh:/rpm-test.sh:ro" \
              --env MODE="$1" --env NEW_INSTALLER --env NEW_VERSION --env OLD_INSTALLER --env OLD_VERSION \
              "$FEDORA_IMAGE" bash /rpm-test.sh
          }
          echo "::group::Fresh install of $NEW_INSTALLER"
          run_container fresh
          echo "::endgroup::"
          if [ -n "$OLD_INSTALLER" ]; then
            echo "::group::Upgrade from $OLD_VERSION to $NEW_VERSION"
            run_container upgrade
            echo "::endgroup::"
          fi

      # Windows MSI: silent per-user installation into the runner account.
      - name: Select MSI installers
        id: msi
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/installer-test.mjs prepare msi
      - name: Test MSI install, upgrade and removal
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NEW_INSTALLER: ${{ steps.msi.outputs.new-installer }}
          NEW_VERSION: ${{ steps.msi.outputs.new-version }}
          OLD_INSTALLER: ${{ steps.msi.outputs.old-installer }}
          OLD_VERSION: ${{ steps.msi.outputs.old-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $logs = Join-Path $env:RUNNER_TEMP 'installer-logs'
          $uninstallKeys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          function Invoke-Msi([string] $action, [string] $installer, [string] $log) {
            $path = (Resolve-Path -LiteralPath $installer).Path
            $arguments = @($action, "`"$path`"", '/qn', '/norestart', '/l*v', "`"$(Join-Path $logs $log)`"")
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $arguments
            if ($process.ExitCode -notin 0, 3010) { throw "msiexec $action $installer failed with exit code $($process.ExitCode)" }
          }
          function Get-Entries {
            @(Get-ItemProperty -Path $uninstallKeys -ErrorAction SilentlyContinue |
              Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'Keyrook' })
          }
          function Assert-Installed([string] $version) {
            $entries = @(Get-Entries)
            $entries | Format-List DisplayName, DisplayVersion, PSPath | Out-String | Write-Host
            if ($entries.Count -ne 1) { throw "Expected one installed Keyrook entry, found $($entries.Count)" }
            if ($entries[0].DisplayVersion -ne $version) { throw "Expected version $version, found $($entries[0].DisplayVersion)" }
            if ($entries[0].PSPath -notlike '*HKEY_CURRENT_USER*') { Write-Host '::warning::Keyrook uninstall entry is not registered per user' }
          }
          function Get-InstallDirectory([string] $log) {
            $found = @(Select-String -LiteralPath (Join-Path $logs $log) -Pattern 'Property\([SC]\): INSTALLDIR = (.+)$')
            $directory = if ($found.Count -gt 0) { $found[-1].Matches[0].Groups[1].Value.Trim() } else { Join-Path $env:LOCALAPPDATA 'Keyrook' }
            Write-Host "Install directory: $directory"
            return $directory
          }
          function Test-Launcher([string] $directory) {
            node scripts/installer-test.mjs self-test (Join-Path $directory 'Keyrook.exe')
            if ($LASTEXITCODE -ne 0) { throw 'Installed runtime check failed' }
          }
          function Remove-AndVerify([string] $installer, [string] $directory, [string] $log) {
            Invoke-Msi '/x' $installer $log
            if (@(Get-Entries).Count -ne 0) { throw 'Keyrook uninstall entry remains' }
            if (Test-Path -LiteralPath (Join-Path $directory 'Keyrook.exe')) { throw 'Installed launcher remains' }
            if (Test-Path -LiteralPath $directory) {
              $remaining = @(Get-ChildItem -LiteralPath $directory -Recurse -Force -File)
              if ($remaining.Count -ne 0) { $remaining | ForEach-Object FullName | Write-Host; throw "Files remain in $directory" }
            }
            Write-Host "Removed $directory"
          }

          if (@(Get-Entries).Count -ne 0) { throw 'Keyrook is already installed on the runner' }
          Write-Host "::group::Fresh install of $env:NEW_INSTALLER"
          Invoke-Msi '/i' $env:NEW_INSTALLER 'fresh-install.log'
          Assert-Installed $env:NEW_VERSION
          $directory = Get-InstallDirectory 'fresh-install.log'
          Test-Launcher $directory
          Remove-AndVerify $env:NEW_INSTALLER $directory 'fresh-uninstall.log'
          Write-Host '::endgroup::'

          if ($env:OLD_INSTALLER) {
            Write-Host "::group::Upgrade from $env:OLD_VERSION to $env:NEW_VERSION"
            Invoke-Msi '/i' $env:OLD_INSTALLER 'upgrade-old-install.log'
            Assert-Installed $env:OLD_VERSION
            Invoke-Msi '/i' $env:NEW_INSTALLER 'upgrade-new-install.log'
            Assert-Installed $env:NEW_VERSION
            $directory = Get-InstallDirectory 'upgrade-new-install.log'
            Test-Launcher $directory
            Remove-AndVerify $env:NEW_INSTALLER $directory 'upgrade-uninstall.log'
            Write-Host '::endgroup::'
          }
      - name: Retain Windows Installer logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs-windows
          path: ${{ runner.temp }}/installer-logs/
          if-no-files-found: ignore
          retention-days: 7

      # macOS DMG: the drag-install equivalent into a temporary Applications directory.
      - name: Select DMG installers
        id: dmg
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/installer-test.mjs prepare dmg
      - name: Test DMG install, replacement and removal
        if: runner.os == 'macOS'
        shell: bash
        env:
          NEW_INSTALLER: ${{ steps.dmg.outputs.new-installer }}
          NEW_VERSION: ${{ steps.dmg.outputs.new-version }}
          OLD_INSTALLER: ${{ steps.dmg.outputs.old-installer }}
          OLD_VERSION: ${{ steps.dmg.outputs.old-version }}
        run: |
          set -euo pipefail
          applications="$(mktemp -d "$RUNNER_TEMP/Applications.XXXXXX")"
          app="$applications/Keyrook.app"
          # Replaces any existing bundle completely, as Finder's Replace does.
          install_dmg() {
            local mount
            mount="$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")"
            # An image with a license agreement asks for acceptance on standard input.
            { yes || true; } | PAGER=cat hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$1" > /dev/null
            [ -d "$mount/Keyrook.app" ] || { echo "Keyrook.app missing from $1"; hdiutil detach "$mount"; exit 1; }
            rm -rf "$app"
            ditto "$mount/Keyrook.app" "$app"
            diff -rq "$mount/Keyrook.app" "$app"
            hdiutil detach "$mount" || hdiutil detach -force "$mount"
            rmdir "$mount"
            [ "$(ls "$applications")" = "Keyrook.app" ] || { echo "Expected exactly one installed bundle"; exit 1; }
            echo "Installed $1 as $app (bundle $(defaults read "$app/Contents/Info" CFBundleShortVersionString))"
          }
          remove_and_verify() {
            rm -rf "$app"
            [ ! -e "$app" ] || { echo "Bundle remains"; exit 1; }
            echo "Removed $app"
          }

          echo "::group::Fresh install of $NEW_INSTALLER"
          install_dmg "$NEW_INSTALLER"
          node scripts/installer-test.mjs self-test "$app/Contents/MacOS/Keyrook"
          remove_and_verify
          echo "::endgroup::"

          if [ -n "$OLD_INSTALLER" ]; then
            echo "::group::Replace $OLD_VERSION with $NEW_VERSION"
            install_dmg "$OLD_INSTALLER"
            install_dmg "$NEW_INSTALLER"
            node scripts/installer-test.mjs self-test "$app/Contents/MacOS/Keyrook"
            remove_and_verify
            echo "::endgroup::"
          fi

  publish:
    needs: [release-please, packages, installer-tests]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Collect matching JDK source archive
        run: node scripts/collect-jdk-archive.mjs
      - name: Download and verify all platform outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for platform in linux windows macos; do
            gh run download "$RUN_ID" --name "packages-${platform}" --dir "build/packages/${platform}"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {createHash} = require('node:crypto');
          const digest = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.mkdirSync('build/release', {recursive: true});
          for (const platform of ['linux', 'windows', 'macos']) {
            const directory = `build/packages/${platform}`;
            const names = fs.readdirSync(directory);
            const manifests = names.filter(name => /^SHA256SUMS-[a-z]+-(x64|arm64)\.txt$/.test(name));
            if (manifests.length !== 1) throw Error('Missing checksum manifest');
            const lines = fs.readFileSync(path.join(directory, manifests[0]), 'utf8').trim().split('\n');
            const verified = new Set();
            for (const line of lines) {
              const match = /^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$/.exec(line);
              if (!match || match[2] === '.' || match[2] === '..' || verified.has(match[2])) throw Error('Invalid checksum record');
              const expected = match[1], name = match[2];
              const source = path.join(directory, name);
              if (!fs.lstatSync(source).isFile() || digest(source) !== expected) throw Error('Package checksum mismatch');
              const target = `build/release/${name}`;
              if (fs.existsSync(target) && digest(target) !== expected) throw Error('Conflicting package output');
              fs.copyFileSync(source, target);
              verified.add(name);
            }
            if (names.some(name => name !== manifests[0] && !verified.has(name))) throw Error('Unverified package output');
          }
          const names = fs.readdirSync('build/release').sort();
          if (!['msi','dmg','deb','rpm'].every(extension => names.filter(name => name.endsWith(`.${extension}`)).length === 1)) {
            throw Error('Incomplete installer set');
          }
          for (const name of fs.readdirSync('build/jdk-source')) {
            if (name.endsWith('.partial') || fs.existsSync(`build/release/${name}`)) throw Error('Invalid source output');
            fs.copyFileSync(`build/jdk-source/${name}`, `build/release/${name}`);
          }
          const releaseFiles = fs.readdirSync('build/release').sort();
          fs.writeFileSync('build/release/SHA256SUMS.txt', releaseFiles.map(name => `${digest(`build/release/${name}`)}  ${name}\n`).join(''));
          NODE
      - name: Upload installers and unsigned installation instructions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > build/release-notes.md
          node <<'NODE'
          const fs = require('node:fs');
          const notes = fs.readFileSync('build/release-notes.md', 'utf8');
          const instructions = fs.readFileSync('docs/PACKAGING.md', 'utf8').split('<!-- unsigned-start -->')[1]?.split('<!-- unsigned-end -->')[0];
          if (!instructions) throw Error('Unsigned installation instructions are missing');
          if (!notes.includes('## Unsigned installers')) fs.appendFileSync('build/release-notes.md', '\n' + instructions);
          NODE
          gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
