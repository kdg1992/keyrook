name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pushes to main write the Gradle cache and must finish; only superseded PR runs are canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/classify-changes.mjs

  build:
    name: build-${{ matrix.platform }}
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Require successful path classification
        if: needs.changes.result != 'success'
        shell: bash
        run: exit 1
      - name: Complete documentation-only check
        if: needs.changes.outputs.docs-only == 'true' && matrix.platform != 'linux'
        shell: bash
        run: echo 'Documentation-only change; the Linux build performs verification.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs-only != 'true' || matrix.platform == 'linux'
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: needs.changes.outputs.docs-only != 'true' || matrix.platform == 'linux'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: needs.changes.outputs.docs-only != 'true' || matrix.platform == 'linux'
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Compile, lint, test and verify native desktop event routing
        if: needs.changes.outputs.docs-only != 'true' || matrix.platform == 'linux'
        shell: bash
        run: |
          tasks=(check :app:desktopWindowCheck --no-daemon --console=plain)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bash ./gradlew "${tasks[@]}"
          else
            bash ./gradlew "${tasks[@]}"
          fi
      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7
