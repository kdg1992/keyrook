breach.consentTitle=Mit bekannten Datenlecks abgleichen?
breach.consentBody=Keyrook berechnet für %s Passwörter aktiver Einträge lokal den SHA-1-Hash und sendet nur dessen erste 5 Zeichen an api.pwnedpasswords.com (Have I Been Pwned, Pwned Passwords). Dafür sind %s Anfragen nötig. Passwörter, vollständige Hashes, Titel, Benutzernamen und Adressen verlassen das Gerät nicht; die Antworten werden lokal verglichen.\n\nDer Dienst sieht Ihre IP-Adresse und den Zeitpunkt der Anfragen. Es wird nichts gespeichert: Ergebnisse bleiben nur bis zum Sperren im Arbeitsspeicher. Diese Frage erscheint vor jedem Abgleich.
